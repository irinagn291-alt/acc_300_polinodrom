name: Perforator
packages:
  Alamofire:
    path: Vendor/Alamofire
options:
  bundleIdPrefix: com.perforator
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  Perforator:
    type: application
    platform: iOS
    sources:
      - path: Perforator
    resources:
      - path: PrivacyInfo.xcprivacy
      - path: Vendor/Alamofire_Alamofire.bundle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.perforator.deal
        PRODUCT_NAME: Perforator
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Perforator/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: Alamofire
        product: Alamofire
      - sdk: RealityKit.framework
  PerforatorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PerforatorTests
    dependencies:
      - target: Perforator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.perforator.deal.tests
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_VERSION: "6.2"
        SWIFT_STRICT_CONCURRENCY: complete
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Perforator.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Perforator"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Automatic
schemes:
  Perforator:
    build:
      targets:
        Perforator: all
        PerforatorTests: [test]
    test:
      targets:
        - PerforatorTests
